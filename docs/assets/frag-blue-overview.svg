<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FRAG overview</title>
  <desc id="desc">FRAG improves answer accuracy in medical RAG systems by rethinking retrieval with topicality and factuality-aware ranking.</desc>
  <rect width="1200" height="420" rx="32" fill="#0B4F8A"/>
  <rect x="34" y="34" width="1132" height="352" rx="28" fill="#0E67B2" opacity="0.72"/>
  <circle cx="1040" cy="70" r="180" fill="#38BDF8" opacity="0.18"/>
  <circle cx="170" cy="380" r="170" fill="#93C5FD" opacity="0.16"/>
  <path d="M90 328C240 252 380 252 530 328C680 404 820 404 1110 260" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.42"/>

  <text x="92" y="150" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="850">FRAG</text>
  <text x="96" y="210" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Factuality-Aware Retrieval-Augmented Generation</text>
  <text x="96" y="270" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750">Improving answer accuracy in medical RAG systems by rethinking retrieval.</text>
  <text x="96" y="318" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">FRAG ranks and selects evidence based on topicality and factuality before generation.</text>
</svg>
